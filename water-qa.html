<!DOCTYPE html>
<!-- R13 临时 QA 页：Waterway 独立渲染（验证桥+水像素观感），验证完可删 -->
<html>
<head><meta charset="utf8"><style>html,body{margin:0}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { Waterway } from '/src/render/scene/Waterway.ts';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1280, 720);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8a5560);
scene.fog = new THREE.Fog(0xb05c6a, 120, 900);
const camera = new THREE.PerspectiveCamera(55, 1280 / 720, 0.1, 4000);

// 大地 + 路面（对齐 Road.ts 口径）
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 6000), new THREE.MeshStandardMaterial({ color: 0x8a7c72, roughness: 0.62 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 2000), new THREE.MeshStandardMaterial({ color: 0x2a2a2d, roughness: 0.38 }));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0, -700); scene.add(road);

const waterway = new Waterway(scene);

// 光照（对齐 Lighting 主光 + 半球口径）
const sun = new THREE.DirectionalLight(0xffd9b0, 2.2);
sun.position.set(-60, 80, 40); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xc9a08a, 0x3a2e2e, 0.9));
const fill = new THREE.DirectionalLight(0x88a0c0, 0.5);
fill.position.set(40, 30, -60); scene.add(fill);

// 机位：车视角（y1.2, z-380 看向桥）+ 侧机位
const shots = [
  { name: 'wq_driver', pos: [0, 1.3, -330], look: [0, 3.2, -450] },
  { name: 'wq_side', pos: [26, 6, -420], look: [0, 2.5, -450] },
  { name: 'wq_under', pos: [0, 1.3, -430], look: [0, 5.5, -452] }
];
let i = 0;
window.__nextShot = () => {
  if (i >= shots.length) return null;
  const s = shots[i++];
  camera.position.set(...s.pos);
  camera.lookAt(...s.look);
  waterway.update(performance.now() / 1000);
  renderer.render(scene, camera);
  return s.name;
};
</script>
</body>
</html>

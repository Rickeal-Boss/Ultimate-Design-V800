  <style>
    /* 第三方许可署名（MIT / Apache-2.0 均要求保留版权与许可声明） */

  <script>
    // QA 钩子：URL hash 含 rafpump 时启用（仅无头/后台受控浏览器用，正常用户不受影响）。
    // 后台标签 Chromium 的 rAF 停转（见 docs/PERF.md §7），用 Worker 定时器泵替代 rAF 驱动循环，
    // 使 CI / 无头环境可完整自动跑局并实测 calls/tris。
    if (location.hash.includes('rafpump')) {
      const queue = [];
      const workerSrc = 'setInterval(() => self.postMessage(0), 16);';
      const worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'application/javascript' })));
      window.requestAnimationFrame = (cb) => { queue.push(cb); return queue.length; };
      worker.onmessage = () => {
        if (queue.length === 0) return;
        const cbs = queue.splice(0);
        const t = performance.now();
        for (const cb of cbs) { try { cb(t); } catch (e) { console.error(e); } }
      };
    }
  </script>
</head>
